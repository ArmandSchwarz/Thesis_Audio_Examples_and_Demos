<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local-global instructions</title><style>*{box-sizing:border-box}body{margin:0;color:#18352f;background:#fff;font:17px/1.6 system-ui,sans-serif}button{font:inherit;cursor:pointer;border:1px solid #ccd6ce;background:white;border-radius:8px;padding:8px 17px;color:#18352f}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #b66d28;outline-offset:3px}.slide[hidden]{display:none}.slide{min-height:520px}.original{position:relative}.original img{width:100%;display:block}.hotspot{position:absolute;left:.5%;width:7%;height:11%;padding:0;background:#ffffffd9;color:#244069;border:2px solid #94abd3;font-size:clamp(14px,3vw,28px)}.viewer-nav{display:flex;justify-content:space-between;align-items:center;padding:14px;border-top:1px solid #dce2d9}.slide-body{padding:25px 32px}.slide-body h1{font-size:26px;color:white;background:#25375e;padding:10px 16px;font-weight:500;line-height:1.3;margin:0 0 20px}.slide-body h2{font-size:18px;color:#25375e;background:#e8eef7;padding:6px 12px;font-weight:500}.example{display:grid;grid-template-columns:38% 1fr;gap:22px;align-items:center;padding:14px 0;border-bottom:1px solid #dce2d9}.example p{margin:4px 0;font-size:15px}.example svg{width:100%;max-height:145px}.global{color:#4779bc}.local{color:#b37a16}.play{font-size:14px;padding:5px 10px}.audio-error{font-size:13px;color:#944323}.response-table{border-collapse:collapse;width:100%;margin-top:25px}.response-table th,.response-table td{text-align:left;padding:14px;border-bottom:1px solid #dce2d9}.response-table th{color:#25375e;width:28%}.footnote{color:#626e68;font-size:14px}.slide-body li{margin-bottom:18px}.slide-body .good-luck{text-align:right;font-size:22px;color:#27715c}@media(max-width:650px){body{font-size:15px}.slide{min-height:0}.slide-body{padding:18px}.example{grid-template-columns:1fr;gap:6px}.example svg{max-width:320px}.slide-body h1{font-size:21px}.response-table th,.response-table td{padding:9px}}</style></head><body><section class="slide" aria-label="Slide 1" ><div class="original"><img src="consigne/slide_1_en.png" alt="English task instructions, slide 1"></div></section>
<section class="slide" aria-label="Slide 2" hidden><div class="original"><img src="consigne/slide_2_en.png" alt="English task instructions, slide 2"><button class="hotspot" type="button" data-audio="consigne/son/son_consigne_slide_2_n1.wav" aria-label="Listen — 2.1" aria-pressed="false" style="top:37%;">▶</button><span class="audio-error" hidden>Audio file unavailable.</span><button class="hotspot" type="button" data-audio="consigne/son/son_consigne_slide_2_n2.wav" aria-label="Listen — 2.2" aria-pressed="false" style="top:64%;">▶</button><span class="audio-error" hidden>Audio file unavailable.</span></div></section>
<section class="slide" aria-label="Slide 3" hidden><div class="original"><img src="consigne/slide_3_en.png" alt="English task instructions, slide 3"><button class="hotspot" type="button" data-audio="consigne/son/son_consigne_slide_3_n1.wav" aria-label="Listen — 3.1" aria-pressed="false" style="top:33%;">▶</button><span class="audio-error" hidden>Audio file unavailable.</span><button class="hotspot" type="button" data-audio="consigne/son/son_consigne_slide_3_n2.wav" aria-label="Listen — 3.2" aria-pressed="false" style="top:60%;">▶</button><span class="audio-error" hidden>Audio file unavailable.</span><button class="hotspot" type="button" data-audio="consigne/son/son_consigne_slide_3_n3.wav" aria-label="Listen — 3.3" aria-pressed="false" style="top:85%;">▶</button><span class="audio-error" hidden>Audio file unavailable.</span></div></section>
<section class="slide" aria-label="Slide 4" hidden><div class="original"><img src="consigne/slide_4_en.png" alt="English task instructions, slide 4"><button class="hotspot" type="button" data-audio="consigne/son/son_consigne_slide_4_n1.wav" aria-label="Listen — 4.1" aria-pressed="false" style="top:22%;">▶</button><span class="audio-error" hidden>Audio file unavailable.</span><button class="hotspot" type="button" data-audio="consigne/son/son_consigne_slide_4_n2.wav" aria-label="Listen — 4.2" aria-pressed="false" style="top:47%;">▶</button><span class="audio-error" hidden>Audio file unavailable.</span><button class="hotspot" type="button" data-audio="consigne/son/son_consigne_slide_4_n3.wav" aria-label="Listen — 4.3" aria-pressed="false" style="top:77%;">▶</button><span class="audio-error" hidden>Audio file unavailable.</span></div></section>
<section class="slide" aria-label="Slide 5" hidden><div class="original"><img src="consigne/slide_5_en.png" alt="English task instructions, slide 5"></div></section>
<section class="slide" aria-label="Slide 6" hidden><div class="original"><img src="consigne/slide_6_en.png" alt="English task instructions, slide 6"></div></section><nav class="viewer-nav" aria-label="Slide navigation"><button type="button" id="previous">← Previous</button><span id="counter" role="status"></span><button type="button" id="next">Next →</button></nav><script>const slides=Array.from(document.querySelectorAll('.slide'));let current=0;const prev=document.getElementById('previous'),next=document.getElementById('next'),counter=document.getElementById('counter');function show(index){current=Math.max(0,Math.min(slides.length-1,index));document.querySelectorAll('[data-audio]').forEach(b=>{b.audio.pause();b.audio.currentTime=0;});slides.forEach((s,i)=>s.hidden=i!==current);prev.disabled=current===0;next.disabled=current===slides.length-1;counter.textContent=(current+1)+' / '+slides.length;reportHeight();}prev.addEventListener('click',()=>show(current-1));next.addEventListener('click',()=>show(current+1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();show(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();show(current-1)}});document.querySelectorAll('[data-audio]').forEach(button=>{const audio=new Audio(button.dataset.audio);audio.preload='none';button.audio=audio;button.addEventListener('click',async()=>{document.querySelectorAll('[data-audio]').forEach(other=>{if(other!==button){other.audio.pause();other.audio.currentTime=0;}});if(!audio.paused){audio.pause();return;}button.nextElementSibling.hidden=true;try{await audio.play();window.parent.postMessage({type:'instructions-audio'},'*');}catch(e){button.nextElementSibling.hidden=false;reportHeight();}});audio.addEventListener('play',()=>button.setAttribute('aria-pressed','true'));['pause','ended'].forEach(event=>audio.addEventListener(event,()=>button.setAttribute('aria-pressed','false')));});function reportHeight(){window.parent.postMessage({type:'instructions-height',height:Math.ceil(document.body.getBoundingClientRect().height)},'*')}window.addEventListener('message',e=>{if(e.source===window.parent&&e.data?.type==='pause-instructions')document.querySelectorAll('[data-audio]').forEach(b=>b.audio.pause());});new ResizeObserver(reportHeight).observe(document.body);document.querySelectorAll('img').forEach(im=>im.addEventListener('load',reportHeight));show(0);</script></body></html>
